# Override for a VPS where an existing Traefik already owns ports 80/443 (instead of Caddy).
# Enable it from `.env`:  COMPOSE_FILE=compose.yaml:deploy/compose.traefik.yaml
# Traefik must be on the TRAEFIK_NETWORK docker network with a certresolver named TRAEFIK_CERTRESOLVER.
# Traefik drops client-sent X-Forwarded-For (no trusted IPs), which the login rate limiter relies on.

services:
  web:
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK in .env}
      - traefik.http.routers.expense-tracker.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.expense-tracker.entrypoints=websecure
      - traefik.http.routers.expense-tracker.tls=true
      - traefik.http.routers.expense-tracker.tls.certresolver=${TRAEFIK_CERTRESOLVER:?set TRAEFIK_CERTRESOLVER in .env}
      - traefik.http.routers.expense-tracker.middlewares=expense-tracker-headers,expense-tracker-compress
      - traefik.http.middlewares.expense-tracker-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.expense-tracker-compress.compress=true
      - traefik.http.services.expense-tracker.loadbalancer.server.port=3000

  # Traefik serves HTTPS, so Caddy never starts (only with `--profile caddy`).
  caddy:
    profiles: ["caddy"]

networks:
  traefik:
    name: ${TRAEFIK_NETWORK}
    external: true
