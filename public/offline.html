<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · Expenses</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f3f5f8;color:#0f172a}
  .card{max-width:22rem;background:#fff;border:1px solid #e2e6ec;border-radius:24px;padding:28px}
  h1{font-size:1.25rem;margin:0 0 8px}
  p{color:#5b6474;line-height:1.5;margin:0 0 16px}
  button{background:#0b4f6c;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:1rem;font-weight:600}
  @media (prefers-color-scheme:dark){body{background:#0b1118;color:#e6edf3}.card{background:#131c26;border-color:#243241}p{color:#93a1b0}button{background:#4fb3d9;color:#06212d}}
</style>
</head>
<body>
<div class="card">
  <h1>You're offline</h1>
  <p>The tracker needs a connection to the server. Nothing can be viewed or saved while offline. No changes are queued.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
